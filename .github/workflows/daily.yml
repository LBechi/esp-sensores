name: Descarga diaria sensores ESP

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a descargar (YYYY-MM-DD). Vacío = comportamiento normal (ayer)'
        required: false
        default: ''

jobs:
  descargar-datos:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Descargar datos de sensores
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 6
          retry_wait_seconds: 30
          command: python download_sensors.py
        env:
          ESP_USERNAME: ${{ secrets.ESP_USERNAME }}
          ESP_PASSWORD: ${{ secrets.ESP_PASSWORD }}
          FECHA_DESCARGA: ${{ github.event.inputs.fecha }}

      - name: Descargar registro de alertas
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 6
          retry_wait_seconds: 30
          command: python download_alertas.py
        env:
          ESP_USERNAME: ${{ secrets.ESP_USERNAME }}
          ESP_PASSWORD: ${{ secrets.ESP_PASSWORD }}
          FECHA_DESCARGA: ${{ github.event.inputs.fecha }}

      - name: Subir capturas si hubo error
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: "*.png"

      - name: Guardar archivos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/ alertas/
          git commit -m "Datos y alertas $(date +'%Y-%m-%d')" || echo "Sin archivos nuevos"
          git push

      - name: Notificar fallo por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Falló la descarga diaria de sensores ESP"
          to: ${{ secrets.MAIL_TO }}
          from: Alertas ESP Sensores
          body: |
            La descarga diaria de datos/alertas de espdesign.com.ar falló después de agotar los reintentos.
            Ver el log completo acá: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
