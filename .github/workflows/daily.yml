name: Descarga diaria sensores ESP

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  descargar-datos:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Descargar datos de sensores
        env:
          ESP_USERNAME: ${{ secrets.ESP_USERNAME }}
          ESP_PASSWORD: ${{ secrets.ESP_PASSWORD }}
        run: python download_sensors.py

      - name: Descargar registro de alertas
        env:
          ESP_USERNAME: ${{ secrets.ESP_USERNAME }}
          ESP_PASSWORD: ${{ secrets.ESP_PASSWORD }}
        run: python download_alertas.py

      - name: Subir capturas si hubo error
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: "*.png"

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Copiar archivos a Google Drive
        run: |
          rclone copy datos/ gdrive:Sensores\ ESP/datos/ --transfers=4
          rclone copy alertas/ gdrive:Sensores\ ESP/alertas/ --transfers=4

      - name: Guardar archivos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/ alertas/
          git commit -m "Datos y alertas $(date +'%Y-%m-%d')" || echo "Sin archivos nuevos"
          git push
